<body class="bg-background font-body-md text-on-surface h-screen w-screen overflow-hidden flex items-center justify-center relative">
<!-- Dimmed Backdrop (Level 3 shadow implies backdrop blur but instructions say centered modal on dimmed backdrop) -->
<div class="absolute inset-0 bg-on-background/40 backdrop-blur-sm z-40 transition-opacity duration-300"></div>
<!-- Modal Container (Level 3 Elevation) -->
<div class="relative z-50 w-full max-w-md bg-surface-container-lowest rounded-xl shadow-2xl overflow-hidden border border-outline-variant flex flex-col transform transition-all duration-300 scale-100 opacity-100">
<!-- Header -->
<div class="flex items-start justify-between px-6 pt-6 pb-4">
<div class="flex items-center gap-3 text-error">
<span class="material-symbols-outlined text-3xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">warning</span>
<h2 class="font-headline-md text-headline-md text-on-surface">Delete Task</h2>
</div>
<button aria-label="Close modal" class="text-on-surface-variant hover:text-on-surface hover:bg-surface-container-highest p-1 rounded-full transition-colors duration-200 group">
<span class="material-symbols-outlined text-xl group-active:scale-95 transition-transform" data-icon="close">close</span>
</button>
</div>
<!-- Body -->
<div class="px-6 pb-6">
<p class="font-body-lg text-body-lg text-on-surface-variant">
                Are you sure you want to delete <strong class="font-medium text-on-surface">"Học Express.js"</strong>? This action cannot be undone.
            </p>
</div>
<!-- Footer / Actions -->
<div class="flex items-center justify-end gap-3 px-6 py-4 bg-surface-container-low border-t border-outline-variant rounded-b-xl">
<button class="px-4 py-2 bg-surface-container-lowest border border-outline-variant text-on-surface font-body-md text-body-md font-medium rounded-lg hover:bg-surface-container-highest active:scale-[0.98] transition-all duration-200">
                Cancel
            </button>
<button class="px-4 py-2 bg-error text-on-error font-body-md text-body-md font-medium rounded-lg shadow-sm hover:bg-on-error-container hover:text-error-container active:scale-[0.98] transition-all duration-200 flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="delete">delete</span>
                Delete Task
            </button>
</div>
</div>
</body></html>
